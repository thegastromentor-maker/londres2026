<style>
:root{
  --paper:#F3EEE3;
  --paper-alt:#EAE3D2;
  --card:#FFFDF8;
  --ink:#16233D;
  --ink-soft:#5B6580;
  --line:#D9CFB6;
  --red:#C41E1A;
  --red-ink:#8f1512;
  --yellow:#C9960A;
  --yellow-bg:#F6E4AE;
  --green:#0E6B34;
  --blue:#1B32A8;
  --shadow: 0 1px 2px rgba(22,35,61,.06), 0 6px 16px rgba(22,35,61,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;-webkit-tap-highlight-color:transparent;}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);position:relative;}
h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* HEADER */
.topbar{padding:18px 18px 14px;background:var(--paper);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);}
.topbar .brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
.topbar h1{font-size:22px;margin:2px 0 0;font-weight:700;letter-spacing:-.01em;}
.topbar h1 .accent{color:var(--red);}

/* DAY PILLS */
.daypills{display:flex;gap:8px;padding:14px 16px 4px;overflow-x:auto;}
.pill{flex:1;border:2px solid var(--ink);border-radius:999px;padding:9px 4px;text-align:center;cursor:pointer;background:var(--card);transition:.15s;}
.pill .d-label{font-family:'Space Grotesk';font-weight:700;font-size:13px;display:block;}
.pill .d-date{font-size:10px;color:var(--ink-soft);font-family:'IBM Plex Mono';}
.pill.active{color:#fff;border-color:transparent;}
.pill.active.red{background:var(--red);}
.pill.active.yellow{background:var(--yellow);color:var(--ink);}
.pill.active.green{background:var(--green);}
.pill.active.blue{background:var(--blue);}
.pill.active .d-date{color:rgba(255,255,255,.85);}
.pill.active.yellow .d-date{color:rgba(22,35,61,.65);}

.daytitle{padding:10px 20px 2px;font-size:15px;color:var(--ink-soft);}
.progresswrap{padding:4px 20px 14px;}
.progressbar{height:6px;background:var(--paper-alt);border-radius:4px;overflow:hidden;}
.progressbar > div{height:100%;border-radius:4px;transition:width .3s;}
.progresstxt{font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono';}
.progressrow{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
.resetbtn{border:none;background:none;color:var(--ink-soft);font-size:11px;font-family:'IBM Plex Mono';cursor:pointer;padding:2px 4px;text-decoration:underline;}
.resetbtn:hover{color:var(--ink);}

/* TIMELINE / TUBE LINE */
.timeline{position:relative;padding:6px 20px 100px;}
.timeline::before{content:'';position:absolute;left:35px;top:12px;bottom:80px;width:3px;background:var(--line);}
.stop{position:relative;padding:0 0 22px 40px;}
.stop .station{position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:50%;background:var(--card);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;}
.stop.done .station{border-color:var(--dayclr);background:var(--dayclr);}
.stop.next .station{border-color:var(--dayclr);box-shadow:0 0 0 5px color-mix(in srgb, var(--dayclr) 18%, transparent);}
.stop .station svg{width:14px;height:14px;stroke:var(--card);}
.stop.done .station svg{display:block;}
.stop .station svg{display:none;}
.stopcard{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;}
.stop.done .stopcard{opacity:.55;}
.stop.next .stopcard{box-shadow:0 0 0 2px var(--dayclr), var(--shadow);}
.stoptime{font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);font-weight:600;}
.stoptitle{font-family:'Space Grotesk';font-weight:600;font-size:15.5px;margin-top:2px;}
.stopdesc{font-size:13px;color:var(--ink-soft);margin-top:4px;line-height:1.4;display:none;}
.stop.open .stopdesc{display:block;}
.transportbox{margin-top:10px;padding:9px 10px;background:var(--paper-alt);border-radius:9px;font-size:12.5px;line-height:1.5;display:none;}
.transportbox b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:3px;font-weight:600;}
.stop.open .transportbox{display:block;}
.stop.open .stopcard{border-radius:14px;}
.chev{float:right;font-size:11px;color:var(--ink-soft);}

/* NEXT BADGE */
.nextbadge{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:#fff;background:var(--dayclr);border-radius:5px;padding:2px 6px;margin-bottom:4px;}

/* DOCS TAB */
.doclist{padding:16px 18px 100px;display:flex;flex-direction:column;gap:14px;}
.doccard{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);}
.doccard .cat{font-family:'Space Grotesk';font-weight:700;font-size:16px;}
.doccard .provider{font-size:12px;color:var(--ink-soft);margin-top:1px;}
.doccard .metagrid{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;}
.doccard .metaitem b{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600;}
.doccard .metaitem span{font-family:'IBM Plex Mono';font-size:12.5px;}
.showbtn{margin-top:14px;width:100%;border:none;background:var(--ink);color:#fff;padding:12px;border-radius:11px;font-family:'Space Grotesk';font-weight:600;font-size:14px;cursor:pointer;}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(22,35,61,.6);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.modal.show{display:flex;}
.modalbody{background:var(--paper);width:100%;max-width:520px;max-height:88vh;border-radius:20px 20px 0 0;overflow-y:auto;padding:16px;}
.modalbody h3{margin:2px 4px 12px;font-size:16px;}
.modalbody img{width:100%;border-radius:12px;margin-bottom:12px;box-shadow:var(--shadow);}
.closebtn{width:100%;padding:12px;border:none;border-radius:11px;background:var(--paper-alt);font-family:'Space Grotesk';font-weight:600;cursor:pointer;margin-top:4px;}

/* MAP */
#map{position:absolute;inset:0;top:0;bottom:64px;}
.maplegend{position:absolute;bottom:78px;left:14px;right:14px;background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:8px 14px;z-index:1000;font-size:11px;align-items:center;}
.legicon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;margin-right:5px;flex-shrink:0;}
.legdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;}
.locbtn{position:absolute;top:14px;right:14px;z-index:1000;background:var(--ink);color:#fff;border:none;width:46px;height:46px;border-radius:50%;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.maptab{position:relative;flex:1;}

/* NAV */
.navbar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:50;}
.navbtn{flex:1;border:none;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--ink-soft);}
.navbtn.active{color:var(--red);}
.navbtn svg{width:21px;height:21px;}
.navbtn span{font-size:10.5px;font-family:'Space Grotesk';font-weight:600;}

.tabpage{display:none;flex:1;flex-direction:column;}
.tabpage.active{display:flex;}
</style>
</head>

<script>
const DAY_COLORS = {red:'#C41E1A', yellow:'#C9960A', green:'#0E6B34', blue:'#1B32A8'};
let currentDay = 0;
let checkedState = {}; // {dayId: [bool,...]}
let map, userMarker, userCircle;

const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

async function loadChecked(dayId){
  try{
    const v = localStorage.getItem('londres2026-checked-'+dayId);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
async function saveChecked(dayId, arr){
  try{ localStorage.setItem('londres2026-checked-'+dayId, JSON.stringify(arr)); }catch(e){}
}

function renderPills(){
  const wrap = document.getElementById('daypills');
  wrap.innerHTML = '';
  DAYS.forEach((d,i)=>{
    const p = document.createElement('div');
    p.className = 'pill' + (i===currentDay ? ' active '+d.color : '');
    p.innerHTML = `<span class="d-label">${d.label}</span><span class="d-date">${d.date}</span>`;
    p.onclick = ()=>{ currentDay = i; renderAll(); };
    wrap.appendChild(p);
  });
}

function renderTimeline(){
  const day = DAYS[currentDay];
  document.getElementById('daytitle').textContent = day.title;
  const clr = DAY_COLORS[day.color];

  let arr = checkedState[day.id];
  if(!arr){ arr = day.activities.map(()=>false); checkedState[day.id] = arr; }

  const doneCount = arr.filter(Boolean).length;
  const total = day.activities.length;
  document.getElementById('progressfill').style.width = (doneCount/total*100)+'%';
  document.getElementById('progressfill').style.background = clr;
  document.getElementById('progresstxt').textContent = `${doneCount} de ${total} completadas`;

  const nextIdx = arr.findIndex(v=>!v);

  const tl = document.getElementById('timeline');
  tl.style.setProperty('--dayclr', clr);
  tl.innerHTML = '';

  day.activities.forEach((act, idx)=>{
    const stop = document.createElement('div');
    let cls = 'stop';
    if(arr[idx]) cls += ' done';
    else if(idx===nextIdx) cls += ' next';
    stop.className = cls;
    stop.style.setProperty('--dayclr', clr);

    const badge = (idx===nextIdx && !arr[idx]) ? `<span class="nextbadge">Siguiente</span><br>` : '';
    const transportHtml = act.transport ? `<div class="transportbox"><b>Cómo llegar</b>${act.transport}</div>` : '';

    stop.innerHTML = `
      <div class="station" data-idx="${idx}">${CHECK_SVG}</div>
      <div class="stopcard" data-idx="${idx}">
        <span class="chev">▾</span>
        <div class="stoptime">${act.time}</div>
        ${badge}
        <div class="stoptitle">${act.title}</div>
        <div class="stopdesc">${act.desc}</div>
        ${transportHtml}
      </div>`;
    tl.appendChild(stop);

    stop.querySelector('.station').onclick = (e)=>{
      e.stopPropagation();
      arr[idx] = !arr[idx];
      saveChecked(day.id, arr);
      renderTimeline();
    };
    stop.querySelector('.stopcard').onclick = ()=>{
      stop.classList.toggle('open');
    };
  });

  document.getElementById('resetbtn').onclick = ()=>{
    if(!confirm('¿Reiniciar el progreso de '+day.label+'? Se desmarcarán todas las actividades.')) return;
    const fresh = day.activities.map(()=>false);
    checkedState[day.id] = fresh;
    saveChecked(day.id, fresh);
    renderTimeline();
  };
}

function renderAll(){
  renderPills();
  renderTimeline();
}

async function initChecks(){
  for(const d of DAYS){
    const saved = await loadChecked(d.id);
    checkedState[d.id] = saved || d.activities.map(()=>false);
  }
  renderAll();
}

// DOCS TAB
function renderDocs(){
  const wrap = document.getElementById('doclist');
  wrap.innerHTML = '';
  TICKETS.forEach(t=>{
    const card = document.createElement('div');
    card.className = 'doccard';
    const metaHtml = t.meta.map(([k,v])=>`<div class="metaitem"><b>${k}</b><span>${v}</span></div>`).join('');
    card.innerHTML = `
      <div class="cat">${t.cat}</div>
      <div class="provider">${t.provider} · ${t.date}</div>
      <div class="metagrid">${metaHtml}</div>
      <button class="showbtn" data-id="${t.id}">Ver ticket</button>`;
    wrap.appendChild(card);
    card.querySelector('.showbtn').onclick = ()=> openModal(t);
  });
}

function openModal(t){
  document.getElementById('modaltitle').textContent = t.cat;
  const imgsWrap = document.getElementById('modalimgs');
  imgsWrap.innerHTML = t.images.map(b64 => `<img src="data:image/jpeg;base64,${b64}">`).join('');
  document.getElementById('modal').classList.add('show');
}
document.getElementById('closemodal').onclick = ()=> document.getElementById('modal').classList.remove('show');
document.getElementById('modal').onclick = (e)=>{ if(e.target.id==='modal') e.currentTarget.classList.remove('show'); };

// MAP TAB
function bagIcon(color){
  return L.divIcon({className:'', html:`<div style="width:30px;height:30px;border-radius:50% 50% 50% 0;background:${color};transform:rotate(-45deg);box-shadow:0 2px 5px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;"><div style="transform:rotate(45deg);color:#fff;">${bagSvg()}</div></div>`, iconSize:[30,30], iconAnchor:[15,29]});
}
function bagSvg(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 016 0"/></svg>'; }
function forkSvg(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M7 3v7a2 2 0 002 2h0a2 2 0 002-2V3M9 12v9M15 3c-1 0-2 1-2 3v4c0 1 1 2 2 2s2-1 2-2V3"/></svg>'; }
function cartSvg(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M3 4h2l2.4 12.2a2 2 0 002 1.8h8.6a2 2 0 002-1.8L22 7H6"/></svg>'; }
function flagSvg(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M5 21V4"/><path d="M5 4h13l-3 4 3 4H5"/></svg>'; }
function starSvg(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="#fff" stroke="none"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6z"/></svg>'; }

function pinIcon(color, svg, starred){
  const badge = starred ? `<div style="position:absolute;top:-4px;right:-4px;width:14px;height:14px;background:#D4AF17;border-radius:50%;display:flex;align-items:center;justify-content:center;transform:rotate(45deg);box-shadow:0 1px 2px rgba(0,0,0,.4);">${starSvg().replace('width="15" height="15"','width="9" height="9"')}</div>` : '';
  return L.divIcon({className:'', html:`<div style="position:relative;width:30px;height:30px;border-radius:50% 50% 50% 0;background:${color};transform:rotate(-45deg);box-shadow:0 2px 5px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;">${badge}<div style="transform:rotate(45deg);">${svg}</div></div>`, iconSize:[30,30], iconAnchor:[15,29]});
}

function buildPopup(p, extraLine){
  const line = extraLine ? `<div style="color:#5B6580;font-size:12px;">${extraLine}</div>` : '';
  const horarioLine = p.horario ? `<div style="color:#5B6580;font-size:11.5px;margin-top:2px;">🕒 ${p.horario}</div>` : '';
  const priceLine = `<div style="margin-top:3px;font-weight:600;font-size:12.5px;">${p.price || 'Gratis'}</div>`;
  const starLine = p.star ? `<div style="display:inline-block;margin-top:4px;margin-right:4px;background:#D4AF17;color:#fff;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:6px;">★ Destacado</div>` : '';
  const recLine = p.rec ? `<div style="display:inline-block;margin-top:4px;background:#F6E4AE;color:#16233D;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:6px;">Reco. ${p.rec}</div>` : '';
  const linkLine = p.maps ? `<div style="margin-top:4px;"><a href="${p.maps}" target="_blank" rel="noopener" style="color:#1B32A8;font-size:12px;">Ver en Google Maps →</a></div>` : '';
  return `<b>${p.name}</b>${line}${priceLine}${horarioLine}${starLine}${recLine}${linkLine}`;
}

function fillLegendIcons(){
  const icons = document.querySelectorAll('#maplegend .legicon');
  const svgs = [bagSvg(), forkSvg(), cartSvg(), flagSvg(), starSvg()];
  icons.forEach((el,i)=>{ el.innerHTML = svgs[i]; });
}

function initMap(){
  if(map) return;
  map = L.map('map', {zoomControl:true}).setView([51.5137, -0.1357], 14);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution:'© OpenStreetMap contributors © CARTO', maxZoom:19, subdomains:'abcd'
  }).addTo(map);
  fillLegendIcons();

  const shopIcon = pinIcon('#C41E1A', bagSvg());
  const foodIcon = pinIcon('#1B32A8', forkSvg());
  const superIcon = pinIcon('#0E6B34', cartSvg());
  const placeIcon = pinIcon('#C9960A', flagSvg());
  const starIcon = pinIcon('#D4AF17', starSvg());

  SHOPS.forEach(p=>{
    const icon = p.star ? pinIcon('#C41E1A', bagSvg(), true) : shopIcon;
    L.marker([p.lat,p.lng], {icon}).addTo(map).bindPopup(buildPopup(p));
  });
  FOOD.forEach(p=>{
    L.marker([p.lat,p.lng], {icon:foodIcon}).addTo(map).bindPopup(buildPopup(p, p.cuisine));
  });
  SUPERMARKETS.forEach(p=>{
    L.marker([p.lat,p.lng], {icon:superIcon}).addTo(map).bindPopup(buildPopup(p));
  });
  (typeof PLACES !== 'undefined' ? PLACES : []).forEach(p=>{
    L.marker([p.lat,p.lng], {icon: p.star ? starIcon : placeIcon}).addTo(map).bindPopup(buildPopup(p, p.cuisine));
  });
}

document.getElementById('locbtn').onclick = ()=>{
  if(!navigator.geolocation){ alert('Geolocalización no disponible en este navegador'); return; }
  navigator.geolocation.watchPosition(pos=>{
    const {latitude, longitude, accuracy} = pos.coords;
    if(!userMarker){
      userMarker = L.circleMarker([latitude,longitude], {radius:8, color:'#fff', weight:3, fillColor:'#1B32A8', fillOpacity:1}).addTo(map);
      map.setView([latitude,longitude], 16);
    } else {
      userMarker.setLatLng([latitude,longitude]);
    }
    if(userCircle) map.removeLayer(userCircle);
    userCircle = L.circle([latitude,longitude], {radius:accuracy, color:'#1B32A8', weight:1, fillOpacity:.08}).addTo(map);
  }, err=>{ alert('No se pudo obtener tu ubicación: '+err.message); }, {enableHighAccuracy:true});
};

// NAV
document.querySelectorAll('.navbtn').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tabpage').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    const tabId = btn.dataset.tab;
    document.getElementById(tabId).classList.add('active');
    if(tabId==='tab-map') setTimeout(()=>{ initMap(); map.invalidateSize(); }, 50);
  };
});

renderDocs();
initChecks();

</script>
</body>
</html>
